<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn thuốc của tôi - MedCare</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/customer.css">
</head>
<body>
    <header class="top-header">
        <div class="top-bar">
            <span>📍 Tìm nhà thuốc</span>
            <a href="orders.html">Tra cứu đơn hàng</a>
            <span>Hotline: 1800 0000</span>
        </div>
        <div class="main-header">
            <a class="logo" href="../index.html"><span>✚</span> MedCare</a>
            <form class="search-box" onsubmit="event.preventDefault(); location.href='products.html?q='+encodeURIComponent(this.q.value)">
                <input name="q" type="text" placeholder="Tìm kiếm thuốc, vitamin...">
                <button type="submit">🔍</button>
            </form>
            <div class="header-actions">
                <span id="authArea"></span>
                <a href="cart.html" class="link-btn">🛒 Giỏ hàng <b id="cartCount">0</b></a>
            </div>
        </div>
        <nav class="nav">
            <a href="../index.html">Trang chủ</a>
            <a href="products.html">Thuốc & Sản phẩm</a>
            <a href="consultation.html">💬 Tư vấn trực tuyến</a>
            <a class="active" href="prescription.html">Đơn thuốc</a>
            <a href="orders.html">Đơn hàng</a>
        </nav>
    </header>

    <main class="page-wrap">
        <h1 style="margin-bottom:18px">Đơn thuốc của tôi</h1>

        <label class="rx-drop" for="rxUpload" style="display:block;cursor:pointer">
            <input id="rxUpload" type="file" style="display:none"
                   accept="image/png,image/jpeg,application/pdf">
            <div class="ic">📎</div>
            <div style="font-size:18px;font-weight:700;margin-top:8px">Tải ảnh đơn thuốc</div>
            <div class="text-muted" style="margin-top:6px">Hỗ trợ PNG, JPG, JPEG, PDF</div>
        </label>

        <h3 class="mb-16">Đơn thuốc đã tải</h3>
        <div id="rxList" class="rx-list"></div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/customer.js"></script>
</body>
</html>
